<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArrowScreen</title><link rel="stylesheet" href="/css/styles.css"></head><body><main class="shell"><section class="card hero"><div class="brand">➤ ArrowScreen</div><h1>Share a screen, simply.</h1><p class="muted">One phone or laptop can share with one receiving laptop through a secure WebRTC session.</p><div class="grid two"><button class="choice" data-mode="phone"><b>Phone → laptop</b><span>Android or iPhone sender</span></button><button class="choice" data-mode="laptop"><b>Laptop → laptop</b><span>Windows or Mac sender</span></button></div><button id="create" class="primary">Create sharing link</button><div id="links" class="hidden"><label>Sender link</label><div class="copy"><input id="share" readonly><button data-copy="share">Copy</button></div><label>Receiver link</label><div class="copy"><input id="view" readonly><button data-copy="view">Copy</button></div><p class="hint">Open the sender link on the device that will share and the receiver link on the laptop.</p></div></section></main><script src="/js/home.js"></script></body></html>
